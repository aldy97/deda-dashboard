name: Deploy Dashboard Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-dashboard-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        env:
          # ARMS 前端监控 pid，在仓库 Settings → Environments → staging 的变量里配置；
          # 未配置时构建产物中的监控层为 no-op，不上报任何数据
          VITE_ARMS_PID: ${{ vars.VITE_ARMS_PID }}
        run: |
          npm ci
          npm run build

      # sourcemap 含完整源码（本仓库为 public），不随产物上服务器；
      # 存为 Actions artifact（保留 30 天），需要反解混淆堆栈时手动上传 ARMS 控制台
      - name: Upload sourcemaps artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-staging-${{ github.sha }}
          path: dist/**/*.map
          retention-days: 30
          if-no-files-found: ignore

      - name: Pack static assets
        run: tar -C dist --exclude='*.map' -czf "dashboard-${{ github.sha }}.tar.gz" .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts

      - name: Transfer to ECS
        run: scp "dashboard-${{ github.sha }}.tar.gz" "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/tmp/"

      # 原子切换：先解压到 .new 再 mv，目标目录任何时刻都是完整的
      - name: Deploy on ECS
        run: |
          ssh "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" bash -s <<'EOF'
          set -e
          mkdir -p /opt/deda/dashboard
          rm -rf /opt/deda/dashboard/staging.new
          mkdir -p /opt/deda/dashboard/staging.new
          tar -xzf /tmp/dashboard-${{ github.sha }}.tar.gz -C /opt/deda/dashboard/staging.new
          rm -f /tmp/dashboard-${{ github.sha }}.tar.gz
          if [ -d /opt/deda/dashboard/staging ]; then
            rm -rf /opt/deda/dashboard/staging.old
            mv /opt/deda/dashboard/staging /opt/deda/dashboard/staging.old
          fi
          mv /opt/deda/dashboard/staging.new /opt/deda/dashboard/staging
          EOF

      # 备案期间：域名未生效，健康检查 = 落盘校验。
      # 备案后替换为：curl -fsS --retry 8 --retry-delay 5 https://staging.<域名>/dashboard/
      - name: Health check (on-disk, pre-ICP)
        run: |
          ssh "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" bash -s <<'EOF'
          set -e
          test -f /opt/deda/dashboard/staging/index.html
          grep -q '/dashboard/assets/' /opt/deda/dashboard/staging/index.html
          echo "OK: $(ls /opt/deda/dashboard/staging/assets | wc -l) asset files deployed"
          EOF
