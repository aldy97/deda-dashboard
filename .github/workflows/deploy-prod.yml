name: Deploy Dashboard Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dashboard-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        env:
          # ARMS 前端监控 pid，在仓库 Settings → Environments → production 的变量里配置；
          # 未配置时构建产物中的监控层为 no-op，不上报任何数据
          VITE_ARMS_PID: ${{ vars.VITE_ARMS_PID }}
        run: |
          npm ci
          npm run build

      # sourcemap 含完整源码（本仓库为 public），不随产物上服务器；
      # 存为 Actions artifact（保留 30 天），需要反解混淆堆栈时手动上传 ARMS 控制台
      - name: Upload sourcemaps artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-prod-${{ github.sha }}
          path: dist/**/*.map
          retention-days: 30
          if-no-files-found: ignore

      - name: Pack static assets
        run: tar -C dist --exclude='*.map' -czf "dashboard-${{ github.sha }}.tar.gz" .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts

      - name: Transfer to ECS
        run: scp "dashboard-${{ github.sha }}.tar.gz" "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/tmp/"

      # 原子切换：先解压到 .new 再 mv，目标目录任何时刻都是完整的
      - name: Deploy on ECS
        run: |
          ssh "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" bash -s <<'EOF'
          set -e
          mkdir -p /opt/deda/dashboard
          rm -rf /opt/deda/dashboard/prod.new
          mkdir -p /opt/deda/dashboard/prod.new
          tar -xzf /tmp/dashboard-${{ github.sha }}.tar.gz -C /opt/deda/dashboard/prod.new
          rm -f /tmp/dashboard-${{ github.sha }}.tar.gz
          if [ -d /opt/deda/dashboard/prod ]; then
            rm -rf /opt/deda/dashboard/prod.old
            mv /opt/deda/dashboard/prod /opt/deda/dashboard/prod.old
          fi
          mv /opt/deda/dashboard/prod.new /opt/deda/dashboard/prod
          EOF

      # 备案已完成（沪ICP备2026060466号-1）：健康检查走真实域名，
      # 同时保留落盘校验兜底（域名侧故障时能区分是产物问题还是链路问题）
      - name: Health check (domain + on-disk)
        run: |
          ssh "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" bash -s <<'EOF'
          set -e
          test -f /opt/deda/dashboard/prod/index.html
          grep -q '/dashboard/assets/' /opt/deda/dashboard/prod/index.html
          echo "OK: $(ls /opt/deda/dashboard/prod/assets | wc -l) asset files deployed"
          curl -fsS --retry 8 --retry-delay 5 --retry-all-errors \
            https://valleyletters.com/dashboard/ > /dev/null
          echo "OK: https://valleyletters.com/dashboard/ reachable"
          EOF
